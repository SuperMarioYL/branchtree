<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="BranchTree 架构：CLI → Core → LLM 适配器 / HTML 渲染器">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="160" x2="280" y2="160" marker-end="url(#ah-l)"/>
    <line x1="460" y1="160" x2="540" y2="160" marker-end="url(#ah-l)"/>
    <line x1="370" y1="200" x2="370" y2="250" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="160" x2="276" y2="160" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="460" y1="160" x2="536" y2="160" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="370" y1="200" x2="370" y2="246" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,160 L276,160" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M460,160 L536,160" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M370,200 L370,246" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="120" width="160" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="120" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">CLI</text>
    <text x="120" y="172" text-anchor="middle" font-size="11" fill="#6E6E73">typer</text>

    <rect x="280" y="120" width="180" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">核心引擎</text>
    <text x="370" y="172" text-anchor="middle" font-size="11" fill="#6E6E73">StoryTree · 一致性</text>

    <rect x="540" y="120" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="625" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">LLM 适配器</text>
    <text x="625" y="172" text-anchor="middle" font-size="11" fill="#6E6E73">openai-compat</text>

    <rect x="280" y="250" width="180" height="70" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">HTML 渲染器</text>
    <text x="370" y="296" text-anchor="middle" font-size="11" fill="#6E6E73">jinja2</text>
  </g>
</svg>
