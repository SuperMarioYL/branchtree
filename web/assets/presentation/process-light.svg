-weight="400">One explicit</text><text x="530.0" y="282.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">contradiction</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="764.0" y="207.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">04  Promote</text><text x="764.0" y="236.4" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">take</text><text x="764.0" y="259.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">main → ch3; all</text><text x="764.0" y="282.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">nodes kept</text><text x="44" y="379.0" fill="#7f7459" font-size="20" text-anchor="start" font-weight="400">Three local chapters; JSON reload and HTML export.</text></svg>
