<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" data-palette="dce656-9ce76a-f6e0ac-5e58edbd6e33" role="img" aria-labelledby="architecture-light-title architecture-light-desc"><title id="architecture-light-title">BranchTree architecture</title><desc id="architecture-light-desc">Chapters, branches and fact records</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="570"><stop stop-color="#74792d"/><stop offset=".6" stop-color="#57803b"/><stop offset="1" stop-color="#7f7459"/></linearGradient><radialGradient id="halo"><stop stop-color="#74792d" stop-opacity=".22"/><stop offset="1" stop-color="#fefef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f4f7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#74792d" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="570" rx="16" fill="#fefef9"/><rect width="1000" height="570" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="245.1" rx="500.0" ry="399.0" fill="url(#halo)"/><text x="44" y="44" fill="#6e7869" font-size="13" text-anchor="start" font-weight="400">ARCHITECTURE / DATA FLOW</text><text x="44" y="84.0" fill="#262a1c" font-size="30" text-anchor="start" font-weight="400">Chapters, branches and fact records</text><path d="M320 203H360" fill="none" stroke="#74792d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 203H360" class="flow" fill="none" stroke="#7f7459" stroke-width="2"/><path d="M676 203H636" fill="none" stroke="#74792d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M676 203H636" class="flow" fill="none" stroke="#7f7459" stroke-width="2"/><path d="M498.0 264V334.0H182.0V372" fill="none" stroke="#74792d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M498.0 264V334.0H182.0V372" class="flow" fill="none" stroke="#7f7459" stroke-width="2"/><path d="M498.0 264V318.0H498.0V372" fill="none" stroke="#74792d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M498.0 264V318.0H498.0V372" class="flow" fill="none" stroke="#7f7459" stroke-width="2"/><rect x="44" y="142" width="276" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="62" y="173.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">Chapter text</text><text x="62" y="225.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">UTF-8 file or direct</text><text x="62" y="248.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">text</text><rect x="360" y="142" width="276" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="378" y="173.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">StoryTree</text><text x="378" y="225.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">Nodes, parent links and</text><text x="378" y="248.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">tips</text><rect x="676" y="142" width="276" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="694" y="173.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">Fact locks</text><text x="694" y="225.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">Named targets and pinned</text><text x="694" y="248.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">facts</text><rect x="44" y="372" width="276" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="62" y="403.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">Rule checker</text><text x="62" y="455.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">Explicit contradiction</text><text x="62" y="478.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">list</text><rect x="360" y="372" width="276" height="122" rx="12" fill="#fdfef7" stroke="#f4f7cb"/><text x="378" y="403.0" fill="#262a1c" font-size="21" text-anchor="start" font-weight="400">JSON / HTML</text><text x="378" y="455.0" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">Save and inspect the</text><text x="378" y="478.8" fill="#6e7869" font-size="17" text-anchor="start" font-weight="400">tree</text></svg>
